apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idle
  template:
    metadata:
      labels:
        app: idle
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          volumeMounts:
            - name: hello
              mountPath: /data
      volumes:
        - name: hello
          persistentVolumeClaim:
            claimName: pvc