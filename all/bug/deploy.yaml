apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idle
  template:
    metadata:
      labels:
        app: idle
    spec:
      containers:
        - name: idle
          image: busybox:1.36
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: hello
              mountPath: /data
      volumes:
        - name: hello
          persistentVolumeClaim:
            claimName: pvc